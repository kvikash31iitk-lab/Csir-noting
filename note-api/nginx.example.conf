# Example nginx server block to expose the note-api on its own subdomain.
# Save as /etc/nginx/sites-available/noteapi.cheetsheet.tech, symlink into
# sites-enabled, then run certbot for HTTPS (see README).

server {
    listen 80;
    server_name noteapi.cheetsheet.tech;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
