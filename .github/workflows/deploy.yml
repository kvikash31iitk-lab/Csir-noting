name: Deploy to VPS

# Triggered manually (by maintainer or via the API) — builds the web app on the
# runner, copies the built assets + backend to the VPS over SSH, and restarts.
# The VPS never needs to pull from GitHub, so no repo visibility toggling.
on:
  workflow_dispatch:
  push:
    branches: [claude/note-sheet-generator-app-tbVN7]
    paths:
      - "NoteSheetGenerator.jsx"
      - "android-app/**"
      - "note-api/server.js"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build web bundle
        working-directory: android-app
        run: |
          npm ci || npm install
          npm run build:web

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Publish web + backend, restart
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          set -e
          SSH="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new $U@$H"
          # 1) Frontend: mirror the freshly built www into the nginx webroot.
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            android-app/www/ "$U@$H:/var/www/notesheet/"
          # 2) Backend: update server.js only (data/ and env are left untouched).
          rsync -az -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            note-api/server.js "$U@$H:/root/note-api/server.js"
          # 3) Restart backend (preserves pm2-saved env) + reload nginx + health check.
          $SSH 'pm2 restart note-api >/dev/null 2>&1 || true; nginx -s reload 2>/dev/null || true; sleep 2; echo -n "health: "; curl -sS http://127.0.0.1:8787/health || true; echo; echo -n "web asset: "; grep -o "app.css?v=[a-z0-9]*" /var/www/notesheet/index.html | head -1'
